name = "open-property"
main = "src/server/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# The built React app (pnpm build → dist/). The Worker runs first for every
# request so the login covers the pages as well as the API; unknown paths fall
# back to index.html for client-side routing.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "open-property-db"
# Replace with the ID of your own D1 database (Cloudflare dashboard →
# Storage & Databases → D1). "local" works for `pnpm dev`.
database_id = "local"
